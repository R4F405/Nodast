<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Nodast: the model proposes nodes, a printer writes the code">
  <!-- Source of docs/social-preview.png, the image for GitHub's social preview (Settings, General). -->
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space: pre; }
  </style>
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="#7ee787"/>
  <text x="96" y="190" class="sans" font-size="112" font-weight="700" fill="#e6edf3">Nodast</text>
  <text x="96" y="262" class="sans" font-size="40" fill="#e6edf3">The model proposes nodes. A printer writes the code.</text>
  <text x="96" y="314" class="sans" font-size="28" fill="#8b949e">A compact AST format for LLM code edits, checked before it becomes TypeScript.</text>

  <rect x="96" y="368" width="1088" height="168" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="128" y="414" class="mono" font-size="24" fill="#79c0ff">&gt; edit {op: "rename", id: "n1", name: "scale"}</text>
  <text x="128" y="450" class="mono" font-size="24" fill="#7ee787">  ok, type number, renamed rate to scale and 2 uses</text>
  <text x="128" y="486" class="mono" font-size="24" fill="#79c0ff">&gt; edit {id: "n25", expr: "(add x true)"}</text>
  <text x="128" y="522" class="mono" font-size="24" fill="#ff7b72">  rejected: type-mismatch n30 expected number actual bool</text>

  <text x="96" y="592" class="sans" font-size="24" fill="#8b949e">github.com/R4F405/Nodast</text>
  <text x="1184" y="592" class="sans" font-size="24" fill="#8b949e" text-anchor="end">TypeScript · Rust · MIT</text>
</svg>
